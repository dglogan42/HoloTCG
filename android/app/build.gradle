plugins {
    id "com.android.application"
}

android {
    namespace "com.dglogan42.holotcg"
    compileSdk 35

    defaultConfig {
        applicationId "com.dglogan42.holotcg"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register("copyWeb", Copy) {
    from rootProject.file("../public")
    into layout.projectDirectory.dir("src/main/assets/www")
}

preBuild.dependsOn("copyWeb")
